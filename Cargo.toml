[package]
name = "mcserver"
version = "0.3.6"
edition = "2024"
description = "Minecraft server multiplexer"
license = "MIT"
repository = "https://github.com/Neovimproved/mcserver"
default-run = "mcserver"

[dependencies]
bitcode = "0.6.9"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
const_format = "0.2.36"
crossterm = { version = "0.29.0", features = ["event-stream"] }
daemonize2 = "0.7.0"
dashmap = "6.2.1"
derive_more = { version = "2.1.1", features = ["display", "error", "from"] }
dirs = "7.0.0"
futures = "0.3.34"
inotify = { version = "0.11.5", features = ["tokio"] }
kdl = "6.7.1"
miette = { version = "7.6.0", features = ["fancy"] }
pty-process = { version = "0.5.4", features = ["async"] }
ratatui = "0.30.2"
shellexpand = "3.1.2"
tokio = { version = "1.54.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"

