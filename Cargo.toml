[workspace]
resolver = "3"
members = ["daemon", "cli", "core"]
metadata.crane.name = "mcserver"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bitcode = "0.6.9"
const_format = "0.2.36"
derive_more = { version = "2.1.1", features = ["display", "error", "from"] }
kdl = "6.7.1"
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["full"] }
mcserver-core = { version = "0.1.0", path = "core" }
